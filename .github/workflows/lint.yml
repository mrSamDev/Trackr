name: Lint

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Biome lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run type check
        run: bunx tsc --noEmit
